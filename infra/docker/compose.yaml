name: driving-data-platform-mac
services:
  postgres:
    image: ${DDP_POSTGRES_IMAGE:?run prepare-images first}
    environment:
      POSTGRES_USER: ddp
      POSTGRES_DB: ddp
      POSTGRES_PASSWORD: ${DDP_POSTGRES_PASSWORD:?required}
    ports:
      - '127.0.0.1:55433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    mem_limit: 1g
    cpus: 1
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ddp -d ddp']
      interval: 2s
      timeout: 3s
      retries: 30
    logging:
      driver: json-file
      options: {max-size: '10m', max-file: '3'}
  spark:
    image: ${DDP_SPARK_IMAGE:?run prepare-images first}
    profiles: [batch]
    user: '0:0'
    hostname: ddp-spark
    extra_hosts: ["ddp-spark:127.0.0.1"]
    network_mode: none
    volumes:
      - ${DDP_OUTPUT_ROOT}/ingestion:/ods:ro
      - ${DDP_OUTPUT_ROOT}/warehouse:/warehouse
      - ../../src:/app/src:ro
      - ../../sql/spark:/app/sql:ro
    environment:
      SPARK_LOCAL_IP: 127.0.0.1
      PYTHONPATH: /app/src
    mem_limit: 3g
    cpus: 2
    logging:
      driver: json-file
      options: {max-size: '10m', max-file: '3'}
volumes:
  postgres-data:
