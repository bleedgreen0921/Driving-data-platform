[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "driving-data-platform"
version = "0.1.0"
description = "Independent driving data platform skeleton and design documents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["driving_data_platform*"]
